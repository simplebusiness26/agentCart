name = "agentcart"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# Daily rescan of connected businesses. runMonitorPass processes a small batch per
# firing, so this stays inside free-tier limits as the number of stores grows.
[triggers]
crons = ["17 3 * * *"]

[vars]
APP_URL = "http://localhost:8787"
SHOPIFY_API_VERSION = "2026-07"

# Rate limiting currently uses a D1 counter (see rateLimit in src/db.ts) so that it is
# testable without workerd. At higher volume, Cloudflare's native binding avoids the
# D1 writes, at the cost of being per-colo and best-effort:
#   [[unsafe.bindings]]
#   name = "RATE_LIMIT"
#   type = "ratelimit"
#   namespace_id = "1001"
#   simple = { limit = 10, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "agentcart"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
