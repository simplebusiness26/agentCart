name = "agentcart"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
APP_URL = "http://localhost:8787"
SHOPIFY_API_VERSION = "2026-07"
DEMO_MODE = "true"

[[d1_databases]]
binding = "DB"
database_name = "agentcart"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
